spring:
  application:
    name: ledger-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 타입 정보를 헤더에 싣지 않는다.
        # 컨슈머는 JSON 본문의 eventType 으로 타입을 판별하므로 헤더가 불필요하고,
        # 헤더에 클래스명이 박히면 서비스 간 패키지 구조가 결합된다.
        spring.json.add.type.headers: false
      # 모든 복제본이 받을 때까지 기다린다. 원장이므로 유실을 허용하지 않는다.
      acks: all
    consumer:
      # gateway-group 은 실시간 중계용이므로 기동 이후 것만 본다.
      # 과거를 읽는 것은 balance-worker / fraud-service 의 몫이다.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.ytw.kafkastudy.common.LedgerEvent
        spring.json.trusted.packages: com.ytw.kafkastudy.common
        spring.json.use.type.headers: false

app:
  topic:
    ledger-events: ledger-events
  consumer-group:
    gateway: gateway-group
  # 파티션 키 모드. 4단계 실험 A 에서 RANDOM 으로 바꿔 잔액이 틀어지는 것을 본다.
  partition-key-mode: USER_ID

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.ytw.kafkastudy: INFO
